name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # publish.yml runs this matrix first (on the systems it passes in `os`):
  # nothing reaches PyPI untested
  workflow_call:
    inputs:
      os:
        description: JSON list of runner labels to test on
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # push / pull_request: every system. publish.yml narrows it via `os`.
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        # 3.8 / 3.9: the runner images no longer ship them (Ubuntu 26.04, arm64
        # macOS), and an editable install on 3.8 cannot even parse the SPDX
        # `license` field with the setuptools that still runs there
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux system deps (Tesseract, X utils, xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr scrot xclip python3-tk xvfb

      - name: Install Tesseract OCR (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install Tesseract OCR (Windows)
        if: runner.os == 'Windows'
        run: choco install --no-progress -y tesseract

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
          pip install pytest pytest-cov "ruff==0.17.3"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (Linux, headless via xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -v

      - name: Run tests
        if: runner.os != 'Linux'
        run: pytest -v

      # pyautogui opens the X display at import: on Linux the import needs xvfb too
      - name: Verify import (Linux, headless via xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import visus.desktop; print('Import OK on ${{ matrix.os }} / Python ${{ matrix.python-version }}')"

      - name: Verify import
        if: runner.os != 'Linux'
        run: python -c "import visus.desktop; print('Import OK on ${{ matrix.os }} / Python ${{ matrix.python-version }}')"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
