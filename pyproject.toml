[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visus-desktop"
version = "0.1.0"
authors = [
    {name = "Matheus Pereira", email = "matheuszwilkdev@gmail.com"},
]
description = "Visus Desktop — desktop GUI automation with multi-technique OCR, robust image detection, smart backtracking, and a non-intrusive virtual mouse."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Desktop Environment",
]
keywords = ["automation", "gui", "ocr", "image-recognition", "rpa", "bot", "desktop-automation", "visus"]
dependencies = [
    "PyAutoGUI>=0.9.54",
    "pytesseract>=0.3.0",
    "opencv-python>=4.9.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pyperclip>=1.8.2",
    "psutil>=5.9.0",
    "mss>=9.0.0",
    "pywin32>=306; sys_platform=='win32'",
]

[project.optional-dependencies]
native = ["pywinauto>=0.6.8; sys_platform=='win32'"]
automation = ["keyboard>=0.13.5", "MouseInfo>=0.1.3", "pandas>=1.0.0"]
ai = ["openai>=1.0.0"]
web = ["webdriver-manager>=4.0.0"]
# Optional OCR backend (Phase 3 / E5): PP-OCR models via ONNX Runtime.
# Activate with config['ocr_backend'] = 'rapidocr'.
rapidocr = ["rapidocr>=2.0.0", "onnxruntime>=1.16.0"]
# pytest-visus fixtures (Phase 2 / TS1): mock_screen, fake_ocr, record_clicks
test = ["pytest>=7.0.0"]
# MCP server -- expose the automation primitives as agent tools.
# Install with: pip install 'visus-desktop[mcp]'
mcp = ["mcp[cli]>=1.27.0"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/matheuszwilk/visus-desktop"
Documentation = "https://github.com/matheuszwilk/visus-desktop#readme"
Repository = "https://github.com/matheuszwilk/visus-desktop.git"
"Bug Tracker" = "https://github.com/matheuszwilk/visus-desktop/issues"

[project.scripts]
visus = "visus.desktop.cli:main"
visus-doctor = "visus.desktop.doctor:main"
visus-mcp = "visus.desktop.mcp_server:main"

[project.entry-points."pytest11"]
visus_pytest = "visus_pytest"

[tool.setuptools.packages.find]
where = ["src"]
include = ["visus*", "visus_pytest*"]
namespaces = true

[tool.setuptools.package-data]
"visus.desktop" = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py38"
src = ["src", "tests"]
# Demo/playground scripts bootstrap sys.path and are not part of the shipped library.
extend-exclude = ["examples", "manual_tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines tolerated (descriptive docstrings)

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring a real display (gated by --integration)",
    "slow: Slow tests that may take longer to run",
    "windows_only: Tests that only run on Windows",
    "linux_only: Tests that only run on Linux",
    "real_input: Sends real keystrokes/mouse/window-close to the focused window; gated behind VISUS_INTEGRATION_REAL_INPUT=1",
]
